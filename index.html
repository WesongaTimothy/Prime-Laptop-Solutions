<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Tech Solutions | Kenya's Premier IT Partner</title>
    <meta name="google-site-verification" content="PYrPNpDG1KkS7aDpoSkr-8q0ZV7kH_efosgQuHAAL4I"/>
    <meta name="keywords" content="Prime Tech Solutions, laptops Kenya, desktops Kenya, IT services Kenya">
    <meta name="author" content="Timothy Wesonga">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* 1. RESET & BASE STYLES */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
        }

        /* 2. PRELOADER OVERLAY */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b; /* Dark tech theme */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        #loader-content {
            text-align: center;
        }

        #loader-logo {
            width: 150px; /* Adjust based on L1.jpeg size */
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
            animation: pulse 2s infinite ease-in-out;
        }

        /* 3. LOADING BAR ANIMATION */
        .loader-bar {
            width: 200px;
            height: 4px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00c6ff, #0072ff); /* Blue tech gradient */
            animation: fillProgress 2s forwards;
        }

        /* KEYFRAMES */
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Hiding class triggered by JS */
        .loaded #loader-wrapper {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>

<body>

    <div id="loader-wrapper">
        <div id="loader-content">
            <img src="L2.jpg" alt="Prime Tech Solutions" id="loader-logo">
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
        </div>
    </div>

    <header style="padding: 20px; text-align: center; background: #fff;">
        <h1>Welcome to Prime Tech Solutions</h1>
        <p>Kenya's Premier IT Partner</p>
    </header>

    <script>
        window.addEventListener("load", function() {
            // Delay of 1.5 seconds to allow the animation to play
            setTimeout(function() {
                document.body.classList.add("loaded");
            }, 1500); 
        });
    </script>

</body>
</html>
